plugins {
    id "com.android.application"
    // Kotlin itself comes from AGP 9's built-in support; only the Compose compiler plugin is applied,
    // and its version must equal AGP's vendored Kotlin (2.2.10).
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseStoreFile = providers.environmentVariable("SRO_RELEASE_STORE_FILE").orNull
def releaseStorePassword = providers.environmentVariable("SRO_RELEASE_STORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("SRO_RELEASE_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("SRO_RELEASE_KEY_PASSWORD").orNull
def releaseSigningConfigured = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { it != null && !it.isBlank() }

android {
    namespace = "com.riteldevelopment.carriertestoverride"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.riteldevelopment.carriertestoverride"
        minSdk = 29
        targetSdk = 36
        versionCode = 12
        versionName = "3.8.0"
        // Keep AGP's generated per-app language list to translations this project actually ships;
        // locale resources bundled inside dependencies must not appear as partially translated UI.
        resourceConfigurations += [
                "en", "zh-rCN", "zh-rTW", "ja", "ko",
                "fr", "de", "es", "pt-rBR", "ru", "tr",
                "ar", "in", "th", "vi"
        ]
    }

    buildFeatures {
        aidl = true
        buildConfig = true
        compose = true
    }

    androidResources {
        generateLocaleConfig true
    }

    // Built-in Kotlin derives its jvmTarget from these, so setting jvmTarget separately is both
    // unnecessary and a common source of "Inconsistent JVM-target compatibility" failures.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

dependencies {
    // Shizuku is vendored rather than resolved, so the privileged surface is pinned to bytes that have
    // been validated on hardware. These four AARs are the whole of app/libs; the annotation jar that
    // used to ship alongside them was dropped because it duplicates the androidx.annotation classes
    // Compose pulls in transitively, which fails the build with "Duplicate class".
    implementation files(
            "libs/aidl-13.1.5.aar",
            "libs/shared-13.1.5.aar",
            "libs/api-13.1.5.aar",
            "libs/provider-13.1.5.aar"
    )

    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    // Declared directly because the manifest intentionally moves InitializationProvider to :ui.
    // The same 1.1.1 is already selected transitively through Lifecycle/Emoji; this makes the class
    // visible to source-manifest lint without changing the resolved runtime version.
    implementation "androidx.startup:startup-runtime:1.1.1"

    implementation platform("androidx.compose:compose-bom:2026.06.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    // material3 no longer brings the icon set transitively, so material-icons-CORE is declared explicitly.
    // material-icons-EXTENDED is deliberately avoided: it is frozen at 1.7.8 while the rest of Compose is
    // at 1.11.4, and it drags in thousands of unused vectors. Conventional controls (overflow, check,
    // warning, lock, chevrons) use the core set; the domain-specific marks — the identity arrow and the
    // hazard hatching — are drawn locally.
    implementation "androidx.compose.material:material-icons-core"

    testImplementation "junit:junit:4.13.2"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
