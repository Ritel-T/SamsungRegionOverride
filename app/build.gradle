plugins {
    id "com.android.application"
    // Kotlin itself comes from AGP 9's built-in support; only the Compose compiler plugin is applied,
    // and its version must equal AGP's vendored Kotlin (2.2.10).
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseStoreFile = providers.environmentVariable("SRO_RELEASE_STORE_FILE").orNull
def releaseStorePassword = providers.environmentVariable("SRO_RELEASE_STORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("SRO_RELEASE_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("SRO_RELEASE_KEY_PASSWORD").orNull
def releaseSigningConfigured = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { it != null && !it.isBlank() }

android {
    namespace = "com.riteldevelopment.carriertestoverride"
    // material3 1.5.0 and Compose 1.12 both declare a minimum compileSdk of 37.
    compileSdk = 37
    compileSdkMinor = 1

    defaultConfig {
        applicationId = "com.ritelt.regionoverride"
        minSdk = 29
        // Opts into the API 37 runtime behaviour changes. Worth re-checking on the reference device
        // after any SDK bump: this app leans on reflected telephony internals and a Shizuku user
        // service, and both are exactly the sort of thing a platform release tightens.
        targetSdk = 37
        versionCode = 13
        versionName = "4.0.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // Keep AGP's generated per-app language list to translations this project actually ships;
        // locale resources bundled inside dependencies must not appear as partially translated UI.
        resourceConfigurations += [
                "en", "zh-rCN", "zh-rTW", "ja", "ko",
                "fr", "de", "es", "pt-rBR", "ru", "tr",
                "ar", "in", "th", "vi"
        ]
    }

    buildFeatures {
        aidl = true
        buildConfig = true
        compose = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    // Built-in Kotlin derives its jvmTarget from these, so setting jvmTarget separately is both
    // unnecessary and a common source of "Inconsistent JVM-target compatibility" failures.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

dependencies {
    // Shizuku is vendored rather than resolved, so the privileged surface is pinned to bytes that have
    // been validated on hardware. These four AARs are the whole of app/libs; the annotation jar that
    // used to ship alongside them was dropped because it duplicates the androidx.annotation classes
    // Compose pulls in transitively, which fails the build with "Duplicate class".
    implementation files(
            "libs/aidl-13.1.5.aar",
            "libs/shared-13.1.5.aar",
            "libs/api-13.1.5.aar",
            "libs/provider-13.1.5.aar"
    )

    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    // Declared directly because the manifest intentionally moves InitializationProvider to :ui.
    // Declaring it here makes the class visible to source-manifest lint, rather than relying on an
    // incidental Lifecycle/Emoji edge to keep a component named in AndroidManifest.xml available.
    implementation "androidx.startup:startup-runtime:1.2.0"

    implementation platform("androidx.compose:compose-bom:2026.08.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    // Pinned above the BOM, which still resolves material3 to 1.4.0. The Material 3 Expressive
    // components — ButtonGroup, LoadingIndicator, the wavy progress indicators, the MaterialShapes
    // library and the expressive MotionScheme — first ship in 1.5.0. There is no separate "expressive"
    // artifact; it is the same module. 1.5.0-alpha27 asks for foundation 1.12.0-beta01 and the BOM
    // supplies 1.12.0, so the rest of Compose stays BOM-managed.
    implementation "androidx.compose.material3:material3:1.5.0-alpha27"
    // WindowSizeClass V2 drives the compact/wide layout under rotation, split screen, DeX and folds.
    // Only the adaptive core is needed; this single-screen tool has no navigation panes to scaffold.
    implementation "androidx.compose.material3.adaptive:adaptive:1.4.0-alpha01"
    // material3 no longer brings the icon set transitively, so material-icons-CORE is declared explicitly.
    // material-icons-EXTENDED is deliberately avoided: the icon artifacts are frozen at 1.7.8 while the
    // rest of Compose keeps moving, and it drags in thousands of unused vectors. Conventional controls (overflow,
    // check, warning, lock, chevrons) use the core set; domain-specific marks are drawn locally.
    implementation "androidx.compose.material:material-icons-core"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation platform("androidx.compose:compose-bom:2026.08.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4-accessibility"
    // Compose UI Test still requests Espresso 3.5.0 transitively. Android 17 removes the hidden
    // InputManager.getInstance() method that version reflects into; 3.7.0 uses getSystemService instead.
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
